name: Social media synchroniseren

on:
  schedule:
    - cron: "15 6 * * *"
      timezone: "Europe/Amsterdam"
  workflow_dispatch:

concurrency:
  group: social-media-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.2"
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::DBI
            any::RMariaDB
            any::httr2
            any::jsonlite
            any::openssl
          needs: check
      - name: Facebook-statistieken ophalen
        env:
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
          FACEBOOK_API_VERSION: ${{ vars.FACEBOOK_API_VERSION }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          SOCIAL_DB_HOST: ${{ secrets.SOCIAL_DB_HOST }}
          SOCIAL_DB_PORT: ${{ secrets.SOCIAL_DB_PORT }}
          SOCIAL_DB_NAME: ${{ secrets.SOCIAL_DB_NAME }}
          SOCIAL_DB_USER: ${{ secrets.SOCIAL_DB_USER }}
          SOCIAL_DB_PASSWORD: ${{ secrets.SOCIAL_DB_PASSWORD }}
          SOCIAL_DB_SSL_CA_PEM: ${{ secrets.SOCIAL_DB_SSL_CA_PEM }}
          SOCIAL_TIMEZONE: Europe/Amsterdam
        run: Rscript sync_social_media.R

